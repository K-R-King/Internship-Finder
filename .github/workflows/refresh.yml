name: Refresh internships

# Rebuilds the listings every day and publishes them to the "data" branch, which the site reads directly.
# That branch is replaced each time rather than added to, so the repo doesn't grow, and no deploy is needed.
# If a source or the whole refresh fails, whatever could be gathered is still published and an issue is opened.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Pretend the refresh failed, to check that an issue gets opened
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Bring back the last listings, for dates added and the saved lookups
        run: |
          # the listings aren't on main, so a fresh checkout has no public/ folder
          mkdir -p public data
          if git fetch --depth=1 origin data; then
            mkdir -p last
            git --work-tree=last checkout FETCH_HEAD -- .
            cp last/internships.json last/jobs-mid.json last/jobs-senior.json public/ 2>/dev/null || true
            cp last/short-links.json last/company-sizes.json data/ 2>/dev/null || true
          fi
      - id: sync
        continue-on-error: true
        run: ${{ inputs.test_alert && 'exit 1' || 'node scripts/sync-internships.mjs' }}
      - id: save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp public/internships.json public/jobs-mid.json public/jobs-senior.json data/short-links.json data/company-sizes.json out/
          # Vercel shouldn't try to build this branch
          echo '{ "git": { "deploymentEnabled": false } }' > out/vercel.json
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Listings from $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
      - name: Open an issue if anything failed
        if: always() && (steps.sync.outcome == 'failure' || steps.save.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create refresh-failed --color B60205 --force
          if [ -z "$(gh issue list --label refresh-failed --state open --json number --jq '.[0].number')" ]; then
            gh issue create --label refresh-failed --title "Internship refresh failed" --body "The daily refresh had a problem, so listings may be out of date: $RUN_URL"
          fi
